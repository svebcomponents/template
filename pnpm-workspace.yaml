packages:
  - apps/*
  - components/*
  - configs/*
catalog:
  "@eslint/compat": 2.1.0
  "@playwright/test": 1.62.1
  "@svebcomponents/build": 0.7.1
  "@svebcomponents/ssr": 0.8.0
  "@sveltejs/adapter-auto": 7.0.1
  "@sveltejs/kit": 2.70.2
  "@sveltejs/vite-plugin-svelte": 7.3.0
  "@tsconfig/strictest": 2.0.8
  "@tsconfig/svelte": 5.0.8
  eslint: 10.8.1
  "@eslint/js": 10.0.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.23.0
  globals: 17.11.0
  prettier: 3.9.6
  prettier-plugin-svelte: 4.1.1
  svelte: 5.56.9
  svelte-check: 4.7.5
  turbo: 2.10.9
  typescript: 5.9.3
  typescript-eslint: 8.65.0
  vite: 8.1.5
allowBuilds:
  esbuild: true
  svelte-preprocess: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - turbo@2.10.7
  # our own scope: these are released from svebcomponents/svebcomponents by
  # the same people who maintain this repo, so the release-age delay buys
  # nothing and only blocks us from consuming a release we just cut.
  - '@svebcomponents/*'
